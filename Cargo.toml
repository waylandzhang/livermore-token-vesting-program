[package]
name = "livermore_vesting_2022"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "livermore_vesting_2022"

[dependencies]
solana-program = "1.17.0"
spl-token-2022 = { version = "0.9.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.3.0", features = ["no-entrypoint"] }
thiserror = "1.0.50"
num-derive = "0.4.1"
num-traits = "0.2.17"
arrayref = "0.3.9"

[features]
no-entrypoint = []
test-sbf = []

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1